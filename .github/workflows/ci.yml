name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. No job here writes to the repository,
# so no job elevates these permissions.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Ajoutee le 2026-08-31, et posee AVANT le build : elle ne compile rien,
      # donc elle rend son verdict en une seconde plutot qu'apres huit minutes
      # de runner macOS. Le depot web porte cette garde depuis le 5 aout, mais
      # sa portee s'arrete a `bacchana/src` : ce depot n'etait couvert par rien,
      # et le mode quiz s'y appelait encore « Quitte ou Trinque » trois semaines
      # apres son renommage.
      - name: Aucun lexique d'alcool a l'ecran
        run: python3 scripts/check_alcohol_lexicon.py

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen (pinned + checksum verified)
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          sudo "$RUNNER_TEMP/xcodegen-dist/xcodegen/install.sh" /usr/local
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Bacchana.xcodeproj \
            -scheme Bacchana \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app for simulator (Release, no code signing)
        run: |
          xcodebuild build \
            -project Bacchana.xcodeproj \
            -scheme Bacchana \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # Secret scan over the full history. Signing certificates and App Store
  # Connect keys will transit through this repository's CI, so a leaked
  # credential must fail the build, not be discovered later.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks lists the commits of the pull request, which the default
    # contents: read is not enough for. Read only: PR comments are disabled
    # below, a leak fails the job and that is the enforcement we want.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
