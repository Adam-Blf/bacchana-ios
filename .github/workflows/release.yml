name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project BlackOut.xcodeproj \
            -scheme BlackOut \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  build-and-upload:
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    env:
      HAS_MATCH: ${{ secrets.MATCH_GIT_URL != '' }}
      HAS_ASC: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator (no signing)
        if: ${{ env.HAS_MATCH != 'true' }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlackOut.xcodeproj \
            -scheme BlackOut \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and upload to TestFlight
        if: ${{ env.HAS_MATCH == 'true' && env.HAS_ASC == 'true' }}
        run: bundle exec fastlane ios beta
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}

      - name: Upload simulator build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build
          path: build/
          retention-days: 7

      - name: Create Release on GitHub
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          draft: false
          prerelease: false
          body: "Submitted to TestFlight for review"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
