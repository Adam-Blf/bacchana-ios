name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default. Only build-and-upload elevates to
# contents: write, because it publishes a GitHub Release.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen (pinned + checksum verified)
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          sudo "$RUNNER_TEMP/xcodegen-dist/xcodegen/install.sh" /usr/local
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Bacchana.xcodeproj \
            -scheme Bacchana \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  build-and-upload:
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # Only this job needs write access, to create the GitHub Release.
    permissions:
      contents: write
    env:
      HAS_MATCH: ${{ secrets.MATCH_GIT_URL != '' }}
      HAS_ASC: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install XcodeGen (pinned + checksum verified)
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          sudo "$RUNNER_TEMP/xcodegen-dist/xcodegen/install.sh" /usr/local
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator (no signing)
        if: ${{ env.HAS_MATCH != 'true' }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Bacchana.xcodeproj \
            -scheme Bacchana \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and upload to TestFlight
        if: ${{ env.HAS_MATCH == 'true' && env.HAS_ASC == 'true' }}
        run: bundle exec fastlane ios beta
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}

      - name: Upload simulator build as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-build
          path: build/
          retention-days: 7

      - name: Create Release on GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          draft: false
          prerelease: false
          body: "Submitted to TestFlight for review"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
