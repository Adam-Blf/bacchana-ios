name: LaTournee
options:
  bundleIdPrefix: com.beloucif
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.15.1"
    CURRENT_PROJECT_VERSION: "1"
    # No target declares a build phase script and no dependency ships a build
    # tool plugin, so the sandbox costs nothing and contains any script that
    # would later run next to signing certificates.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.83.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.69.0

targets:
  LaTourneeCore:
    type: framework
    platform: iOS
    sources:
      - path: LaTourneeCore/Sources/LaTourneeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.latournee.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  LaTourneeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LaTourneeTests
    dependencies:
      - target: LaTourneeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.latournee.coretests
        GENERATE_INFOPLIST_FILE: YES

  LaTournee:
    type: application
    platform: iOS
    sources:
      - path: LaTournee
        excludes:
          - "**/.DS_Store"
          - "Resources/Packs/**"
          - "PrivacyInfo.xcprivacy"
      # Apple privacy manifest: forced into the resources build phase so it
      # ships at the app bundle root (required for App Store submission).
      - path: LaTournee/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Folder reference (blue folder): preserves the Packs/ subdirectory in
      # the built bundle, required by ContentLibrary's
      # `subdirectory: "Packs"` lookup.
      - path: LaTournee/Resources/Packs
        type: folder
        buildPhase: resources
    dependencies:
      - target: LaTourneeCore
        embed: true
      - package: RevenueCat
        product: RevenueCat
      - package: PostHog
        product: PostHog
    configFiles:
      Debug: LaTournee/Config/Config.xcconfig
      Release: LaTournee/Config/Config.xcconfig
    info:
      path: LaTournee/Info.plist
      properties:
        CFBundleDisplayName: La Tournée
        CFBundleName: La Tournée
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Anton-Regular.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        POSTHOG_API_KEY: "$(POSTHOG_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.latournee
        PRODUCT_NAME: LaTournee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

schemes:
  LaTournee:
    build:
      targets:
        LaTournee: all
        LaTourneeCore: all
        LaTourneeTests: [test]
    test:
      config: Debug
      targets:
        - LaTourneeTests
    run:
      config: Debug
    archive:
      config: Release

  LaTourneeCore:
    build:
      targets:
        LaTourneeCore: all
        LaTourneeTests: [test]
    test:
      config: Debug
      targets:
        - LaTourneeTests
