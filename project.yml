name: BlackOut
options:
  bundleIdPrefix: com.beloucif
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  BlackOutCore:
    type: framework
    platform: iOS
    sources:
      - path: BlackOutCore/Sources/BlackOutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.blackout.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  BlackOutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlackOutTests
    dependencies:
      - target: BlackOutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.blackout.coretests
        GENERATE_INFOPLIST_FILE: YES

  BlackOut:
    type: application
    platform: iOS
    sources:
      - path: BlackOut
        excludes:
          - "**/.DS_Store"
          - "Resources/Packs/**"
      # Folder reference (blue folder): preserves the Packs/ subdirectory in
      # the built bundle, required by ContentLibrary's
      # `subdirectory: "Packs"` lookup.
      - path: BlackOut/Resources/Packs
        type: folder
        buildPhase: resources
    dependencies:
      - target: BlackOutCore
        embed: true
    info:
      path: BlackOut/Info.plist
      properties:
        CFBundleDisplayName: BlackOut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Anton-Regular.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        NSUserTrackingUsageDescription: "BlackOut n'utilise aucun suivi publicitaire."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.blackout
        PRODUCT_NAME: BlackOut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

schemes:
  BlackOut:
    build:
      targets:
        BlackOut: all
        BlackOutCore: all
        BlackOutTests: [test]
    test:
      config: Debug
      targets:
        - BlackOutTests
    run:
      config: Debug
    archive:
      config: Release

  BlackOutCore:
    build:
      targets:
        BlackOutCore: all
        BlackOutTests: [test]
    test:
      config: Debug
      targets:
        - BlackOutTests
