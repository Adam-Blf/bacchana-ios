name: Meskova
options:
  bundleIdPrefix: com.beloucif
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.14.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.83.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.69.0

targets:
  MeskovaCore:
    type: framework
    platform: iOS
    sources:
      - path: MeskovaCore/Sources/MeskovaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.meskova.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  MeskovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeskovaTests
    dependencies:
      - target: MeskovaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.meskova.coretests
        GENERATE_INFOPLIST_FILE: YES

  Meskova:
    type: application
    platform: iOS
    sources:
      - path: Meskova
        excludes:
          - "**/.DS_Store"
          - "Resources/Packs/**"
          - "PrivacyInfo.xcprivacy"
      # Apple privacy manifest: forced into the resources build phase so it
      # ships at the app bundle root (required for App Store submission).
      - path: Meskova/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Folder reference (blue folder): preserves the Packs/ subdirectory in
      # the built bundle, required by ContentLibrary's
      # `subdirectory: "Packs"` lookup.
      - path: Meskova/Resources/Packs
        type: folder
        buildPhase: resources
    dependencies:
      - target: MeskovaCore
        embed: true
      - package: RevenueCat
        product: RevenueCat
      - package: PostHog
        product: PostHog
    configFiles:
      Debug: Meskova/Config/Config.xcconfig
      Release: Meskova/Config/Config.xcconfig
    info:
      path: Meskova/Info.plist
      properties:
        CFBundleDisplayName: Meskova
        CFBundleName: Meskova
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Anton-Regular.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        NSUserTrackingUsageDescription: "Meskova n'utilise aucun suivi publicitaire."
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        POSTHOG_API_KEY: "$(POSTHOG_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.meskova
        PRODUCT_NAME: Meskova
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

schemes:
  Meskova:
    build:
      targets:
        Meskova: all
        MeskovaCore: all
        MeskovaTests: [test]
    test:
      config: Debug
      targets:
        - MeskovaTests
    run:
      config: Debug
    archive:
      config: Release

  MeskovaCore:
    build:
      targets:
        MeskovaCore: all
        MeskovaTests: [test]
    test:
      config: Debug
      targets:
        - MeskovaTests
