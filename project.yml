name: LaTaverne
options:
  bundleIdPrefix: com.beloucif
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  LaTaverneCore:
    type: framework
    platform: iOS
    sources:
      - path: LaTaverneCore/Sources/LaTaverneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.lataverne.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  LaTaverneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LaTaverneTests
    dependencies:
      - target: LaTaverneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.lataverne.coretests
        GENERATE_INFOPLIST_FILE: YES

  LaTaverne:
    type: application
    platform: iOS
    sources:
      - path: LaTaverne
        excludes:
          - "**/.DS_Store"
          - "Resources/Packs/**"
          - "PrivacyInfo.xcprivacy"
      # Apple privacy manifest: forced into the resources build phase so it
      # ships at the app bundle root (required for App Store submission).
      - path: LaTaverne/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Folder reference (blue folder): preserves the Packs/ subdirectory in
      # the built bundle, required by ContentLibrary's
      # `subdirectory: "Packs"` lookup.
      - path: LaTaverne/Resources/Packs
        type: folder
        buildPhase: resources
    dependencies:
      - target: LaTaverneCore
        embed: true
    info:
      path: LaTaverne/Info.plist
      properties:
        CFBundleDisplayName: La Taverne
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Anton-Regular.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        NSUserTrackingUsageDescription: "La Taverne n'utilise aucun suivi publicitaire."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beloucif.lataverne
        PRODUCT_NAME: LaTaverne
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

schemes:
  LaTaverne:
    build:
      targets:
        LaTaverne: all
        LaTaverneCore: all
        LaTaverneTests: [test]
    test:
      config: Debug
      targets:
        - LaTaverneTests
    run:
      config: Debug
    archive:
      config: Release

  LaTaverneCore:
    build:
      targets:
        LaTaverneCore: all
        LaTaverneTests: [test]
    test:
      config: Debug
      targets:
        - LaTaverneTests
